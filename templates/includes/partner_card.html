{% load website_tags %}
<article class="partner-card">
  <a href="{{ partner.url }}" target="_blank" rel="noopener noreferrer">
    <div class="partner-media">
      <p class="partner-kicker"><span>{{ index|default:1|stringformat:"02d" }}</span> / {% ui "partners_kicker" %}</p>
      {% if partner.image_url %}
        <img src="{{ partner.image_url }}" alt="{{ partner.name }}" loading="lazy" />
      {% endif %}
      <span class="partner-logo">
        {% if partner.logo_url %}
          <img src="{{ partner.logo_url }}" alt="" />
        {% else %}
          {{ partner.name }}
        {% endif %}
      </span>
    </div>
    <div class="partner-copy">
      <h3>
        {{ partner.name }}
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M4 12 L12 4 M7 4 H12 V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </h3>
      <p>{% loc partner "description" lang %}</p>
      <span class="partner-cta">
        {% ui "partners_visit" %}
        <svg viewBox="0 0 18 10" aria-hidden="true" focusable="false">
          <path d="M0 5 H16 M12 1 L16 5 L12 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
    </div>
  </a>
</article>
